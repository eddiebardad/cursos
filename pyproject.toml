[project]
name = "cursodex-extractor"
version = "0.3.0"
description = "CLI sin estado para extraer y normalizar cursos gratuitos con JSON-LD/CSV para Omeka S; stateless course extractor with Schema.org and Dublin Core exports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cursodex", email = "research@cursodex.com" }]
keywords = ["open-data", "semantic-web", "schema.org", "dublin-core", "omeka-s", "course-catalog"]

dependencies = [
    # --- HTTP y renderizado dinámico ---
    "httpx>=0.27.0",
    "playwright>=1.40.0",

    # --- Parseo HTML y extracción semántica ---
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "lxml-html-clean>=0.4.0",   # requerido por extruct en tiempo de ejecución con lxml>=5
    "html5lib>=1.1",
    "extruct>=0.16.0",          # extracción primaria de JSON-LD, Microdata, OpenGraph, RDFa

    # --- Validación y modelo de datos ---
    "pydantic>=2.9.0",
    "pyyaml>=6.0.1",            # lectura de vocab_map.yml

    # --- CLI ---
    "typer>=0.12.0",
    "click>=8.0.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
cursodex = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",     # mocks de red para tests de providers
    "respx>=0.21.0",            # alternativa de mocking para httpx
    "ruff>=0.4.0",              # linter/formatter
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
"only-include" = [
    "cli.py",
    "config.py",
    "core",
    "utils",
    "exporters",
    "providers",
    "schemas",
    "mappings/vocab_map.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["extruct.*"]
ignore_missing_imports = true
